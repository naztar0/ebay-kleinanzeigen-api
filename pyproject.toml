[project]
name = "ebay-kleinanzeigen-api"
version = "1.0.0"
description = "Refined Kleinanzeigen scraping API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "fastapi>=0.115.6",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic-settings>=2.6.1",
    "pytest>=8.4.1",
    "uvicorn>=0.34.0",
]

[tool.ruff.lint]
extend-select = ["I"]

[dependency-groups]
dev = [
    "matplotlib>=3.10.6",
    "ruff>=0.13.2",
]
